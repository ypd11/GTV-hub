<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="google" content="notranslate">
    <title>GTV hub - Movies & TV Shows</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="stylesheet" href="style.css?v=29">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&amp;v=30" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body class="notranslate">

<nav class="top-nav">
    <div class="nav-left">
        <div class="brand-logo" onclick="switchTab('movie')">GTV<span> hub</span></div>
        <div class="nav-links">
            <div class="nav-item active" id="nav-movie" onclick="switchTab('movie')">Movies</div>
            <div class="nav-item" id="nav-tv" onclick="switchTab('tv')">TV Shows</div>
            <div class="nav-item" onclick="openCategories()">Categories</div>
        </div>
    </div>
    <div class="nav-right">
        <div class="search-container">
            <input id="search" placeholder="What are you looking for?" autocomplete="off">
            <button class="search-icon-btn" onclick="toggleSearch()"><span class="material-icons">search</span></button>
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
    </div>
</nav>

<!-- Profile Selection View -->
<section id="profile-view" style="display:none;">
    <div class="profile-container">
        <div class="brand-logo profile-brand">GTV<span> hub</span></div>
        <h2 id="profile-title">Who is watching?</h2>
        <div id="profile-list" class="profile-list"></div>
        <button id="manage-profiles-btn" class="more-info-btn" onclick="toggleManageProfiles()">Manage Profiles</button>
    </div>
</section>

<div id="content">
    <!-- Dashboard View -->
    <main id="dashboard" class="view-container">
        <section id="hero-section"></section>
        <div id="rows-container">
            <div class="loading-state">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Details View -->
    <section id="details-view" class="view-container" style="display:none;">
        <div id="details-content"></div>
    </section>

    <!-- Category List View (See All) -->
    <section id="category-view" class="view-container" style="display:none; padding-top: 80px;">
        <div class="category-header-block" style="padding: 0 4%; margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
            <button class="back-btn-simple" onclick="closeCategoryView()"><span class="material-icons">arrow_back</span></button>
            <h1 id="category-title">Category</h1>
        </div>
        <div id="category-list" style="padding: 0 4%;"></div>
    </section>


    <!-- People Discovery -->
    <section id="people-view" class="view-container people-view" style="display:none;">
        <div class="people-hero">
            <div class="people-hero-glow"></div>
            <div class="people-eyebrow"><span class="material-icons">auto_awesome</span> THE PEOPLE BEHIND THE STORIES</div>
            <h1>Discover <span>People.</span></h1>
            <p>Meet the actors, filmmakers and creative minds behind the movies and shows you love.</p>
            <div class="people-search-wrap">
                <span class="material-icons">search</span>
                <input id="people-search-input" type="search" placeholder="Search actors, directors, writers..." autocomplete="off">
                <button id="people-search-clear" type="button" aria-label="Clear search"><span class="material-icons">close</span></button>
            </div>
        </div>
        <div class="people-content">
            <div id="people-discover-content">
                <div class="people-section-heading"><div><span class="people-kicker">IN THE SPOTLIGHT</span><h2>Popular actors</h2></div><span class="people-section-note">Updated by TMDB</span></div>
                <div id="people-popular-grid" class="people-grid"><div class="people-loading"><div class="spinner"></div></div></div>
            </div>
            <div id="people-search-content" style="display:none;">
                <div class="people-section-heading"><div><span class="people-kicker">SEARCH RESULTS</span><h2 id="people-results-title">People</h2></div><span id="people-results-count" class="people-section-note"></span></div>
                <div id="people-results-grid" class="people-grid"></div>
            </div>
        </div>
    </section>
    <section id="person-profile-view" class="view-container person-profile-view" style="display:none;">
        <div id="person-profile-content"></div>
    </section>

    <!-- Player View -->
    <section id="player-container" class="video-container" style="display:none;">
        <button id="close-player" class="back-btn-overlay">
            <span class="material-icons">arrow_back</span> Back
        </button>
        <iframe id="stream-frame" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </section>
</div>

<script src="script.js?v=29"></script>
</body>
</html>
