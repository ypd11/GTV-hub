<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <title>Reset password · GTV hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; color: #f5f7fa; font-family: 'Outfit', sans-serif; background: radial-gradient(ellipse at 12% 12%, rgba(52,152,219,.18), transparent 48%), radial-gradient(ellipse at 88% 88%, rgba(155,89,182,.20), transparent 48%), #08090b; }
    main { position: relative; width: min(100%, 460px); padding: 42px 34px 34px; border: 1px solid rgba(255,255,255,.11); border-radius: 22px; background: radial-gradient(ellipse at 100% 0%, rgba(155,89,182,.12), transparent 48%), linear-gradient(155deg,#171c24,#101319 72%); box-shadow: 0 24px 80px rgba(0,0,0,.42); }
    .brand { margin-bottom: 30px; text-align: center; font-size: 29px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg,#3498db 0%,#9b59b6 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .brand span { font-weight: 300; }
    .icon { width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 17px; color: #b69ae8; background: rgba(155,89,182,.14); }
    .icon .material-icons { font-size: 29px; }
    h1 { margin: 0 0 10px; text-align: center; font-size: 1.55rem; letter-spacing: -.4px; }
    .intro { margin: 0 0 25px; text-align: center; color: #aab5c2; font-size: .92rem; line-height: 1.65; }
    label { display: block; margin: 15px 0 8px; color: #d9e0e9; font-size: .85rem; font-weight: 600; }
    input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid rgba(255,255,255,.13); border-radius: 10px; outline: none; background: #0d1117; color: #fff; font: inherit; }
    input:focus { border-color: #9b72d0; box-shadow: 0 0 0 3px rgba(155,89,182,.13); }
    button,.link { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; margin-top: 22px; padding: 12px 18px; border: 0; border-radius: 50px; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; background: linear-gradient(135deg,#3498db 0%,#9b59b6 100%); box-shadow: 0 7px 22px rgba(91,105,205,.2); }
    button:disabled { opacity: .65; cursor: wait; }
    .link { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); box-shadow: none; }
    #status { min-height: 22px; margin: 16px 0 0; color: #aab5c2; text-align: center; font-size: .86rem; line-height: 1.5; overflow-wrap: anywhere; }
    #status.error { color: #ff8f8f; } #status.success { color: #73d99a; }
    @media(max-width:480px) { main { padding: 34px 23px 27px; border-radius: 18px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">GTV<span> hub</span></div>
    <div class="icon"><span class="material-icons">lock_reset</span></div>
    <h1 id="title">Choose a new password</h1>
    <p class="intro" id="intro">Create a new password for your GTV hub account.</p>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter it again">
      <button id="submit" type="submit">Update password</button>
    </form>
    <p id="status" role="status" aria-live="polite">Verifying your secure reset link…</p>
    <a class="link" id="back-link" href="https://gtvhub.net/" hidden>Back to GTV hub</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://fvjlovsvihuzrajzndap.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_d6tKvsXFUGkI59kXvKiy9Q_Z-6-tKMR';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const form = document.getElementById('reset-form');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');
    let recoverySessionReady = false;
    function setStatus(message, kind = '') { status.textContent = message; status.className = kind; }
    function showExpired(message) {
      document.getElementById('title').textContent = 'Reset link unavailable';
      document.getElementById('intro').textContent = message;
      form.hidden = true;
      document.getElementById('back-link').hidden = false;
      setStatus('', '');
    }
    async function checkRecoverySession() {
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (data.session && data.session.user) {
        recoverySessionReady = true;
        form.hidden = false;
        setStatus('Your secure reset link is verified. You can now choose a new password.', 'success');
        return;
      }
      showExpired('This password reset link is invalid, expired, or has already been used. Please request a new one from GTV hub.');
    }
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        recoverySessionReady = true;
        form.hidden = false;
        setStatus('Your secure reset link is verified. You can now choose a new password.', 'success');
      }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!recoverySessionReady) return;
      const password = document.getElementById('new-password').value;
      const confirmation = document.getElementById('confirm-password').value;
      if (password !== confirmation) return setStatus('The passwords do not match.', 'error');
      submit.disabled = true;
      submit.textContent = 'Updating…';
      setStatus('Updating your password…');
      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        await client.auth.signOut();
        form.hidden = true;
        document.getElementById('title').textContent = 'Password updated';
        document.getElementById('intro').textContent = 'Your password has been changed successfully. You can now sign in to GTV hub using your new password.';
        document.getElementById('back-link').hidden = false;
        setStatus('Your account is secure with your new password.', 'success');
      } catch (error) {
        setStatus(error.message || 'We could not update your password. Please request a new reset link.', 'error');
        submit.disabled = false;
        submit.textContent = 'Update password';
      }
    });
    checkRecoverySession().catch(error => showExpired(error.message || 'We could not verify this reset link. Please request a new one.'));
  </script>
</body>
</html>
