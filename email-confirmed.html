<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">
  <title>Email confirmation · GTV Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #08090b; color: #f5f5f5;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px); padding: 42px 30px; text-align: center;
      background: #141619; border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    .brand { margin-bottom: 30px; font-size: 1.8rem; font-weight: 800; letter-spacing: -1.2px; }
    .brand span { color: #3498db; }
    .icon {
      width: 68px; height: 68px; margin: 0 auto 22px; display: grid; place-items: center;
      border-radius: 50%; background: rgba(46,204,113,.12); color: #2ecc71; font-size: 32px;
    }
    h1 { margin: 0 0 12px; font-size: 1.55rem; }
    p { margin: 0; color: #aeb4bd; line-height: 1.65; }
    a {
      display: block; margin-top: 28px; padding: 14px 20px; border-radius: 10px;
      background: #3498db; color: white; text-decoration: none; font-weight: 700;
      transition: background .2s ease, transform .2s ease;
    }
    a:hover { background: #2585c5; transform: translateY(-1px); }
    .error .icon { background: rgba(231,76,60,.12); color: #e74c3c; }
  </style>
</head>
<body>
  <main id="confirmation-card">
    <div class="brand">GTV <span>hub</span></div>
    <div class="icon" aria-hidden="true">✓</div>
    <h1 id="confirmation-title">Email confirmed!</h1>
    <p id="confirmation-message">Your email address has been verified. You can now return to GTV Hub and sign in to your account.</p>
    <a href="/">Continue to GTV Hub</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const error = params.get('error_description') || params.get('error') ||
      hash.get('error_description') || hash.get('error');
    if (error) {
      const card = document.getElementById('confirmation-card');
      card.classList.add('error');
      document.getElementById('confirmation-title').textContent = 'Confirmation link issue';
      document.getElementById('confirmation-message').textContent =
        'We could not complete email confirmation: ' + error.replace(/\+/g, ' ');
    }
  </script>
</body>
</html>
